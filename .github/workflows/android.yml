name: Android APK build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload debug APK (testing only; not for upgrades)
        uses: actions/upload-artifact@v4
        with:
          name: pilot-companion-debug-testing-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify release signing secrets
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.PILOT_SIGNING_KEYSTORE_BASE64 }}
          PILOT_SIGNING_STORE_PASSWORD: ${{ secrets.PILOT_SIGNING_STORE_PASSWORD }}
          PILOT_SIGNING_KEY_ALIAS: ${{ secrets.PILOT_SIGNING_KEY_ALIAS }}
          PILOT_SIGNING_KEY_PASSWORD: ${{ secrets.PILOT_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$PILOT_SIGNING_STORE_PASSWORD" || -z "$PILOT_SIGNING_KEY_ALIAS" || -z "$PILOT_SIGNING_KEY_PASSWORD" ]]; then
            echo "::notice::Release APK skipped: configure all four PILOT_SIGNING_* repository secrets. Do not install the debug APK as an update."
            echo "RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Decode release keystore securely
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.PILOT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pilot-release.jks"
          echo "PILOT_SIGNING_STORE_FILE=$RUNNER_TEMP/pilot-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          PILOT_SIGNING_STORE_PASSWORD: ${{ secrets.PILOT_SIGNING_STORE_PASSWORD }}
          PILOT_SIGNING_KEY_ALIAS: ${{ secrets.PILOT_SIGNING_KEY_ALIAS }}
          PILOT_SIGNING_KEY_PASSWORD: ${{ secrets.PILOT_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload signed release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pilot-companion-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pilot-release.jks"
